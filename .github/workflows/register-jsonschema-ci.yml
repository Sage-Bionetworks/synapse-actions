name: Register JSON Schema CI

on:
  pull_request:
    branches:
      - main
    paths: &ci-paths
      - register-jsonschema/**
      - generate-jsonschema/**
      - .github/workflows/register-jsonschema-ci.yml
      - .github/workflows/python-tests.yml
      - shared/**
  push:
    branches:
      - main
    paths: *ci-paths

permissions:
  contents: read

# The jobs register schemas in the shared Synapse org dpetest. Do not let two
# runs do this at the same time. A new run waits, and does not cancel the run
# that is in progress.
concurrency:
  group: register-jsonschema-dpetest
  cancel-in-progress: false

defaults:
  run:
    working-directory: register-jsonschema

jobs:

  test-code:
    name: Tests
    uses: ./.github/workflows/python-tests.yml
    with:
      action-directory: register-jsonschema
      # Must match the Python version in the Dockerfile base image.
      python-version: "3.15"
      synapseclient-extras: curator
      test-path: tests
    secrets:
      SYNAPSE_AUTH_TOKEN: ${{ secrets.SYNAPSE_AUTH_TOKEN }}


  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test Local Action
        id: register
        uses: ./register-jsonschema
        with:
          org-name: dpetest
          schema-dir: register-jsonschema/tests/data/schema_dir
          synapse-auth-token: ${{ secrets.SYNAPSE_AUTH_TOKEN }}

      - name: Check Registered URIs
        env:
          URIS: ${{ steps.register.outputs.uris }}
        run: ./tests/check_uris.sh 2 dpetest

  test-workflow:
    name: GitHub Workflow Test
    runs-on: ubuntu-latest
    needs: test-action

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate JSON Schemas
        id: generate
        uses: ./generate-jsonschema
        with:
          data-model-source: ./register-jsonschema/tests/data/data_model.csv
          data-model-labels: "display_label"

      - name: Register JSON Schemas
        id: register
        uses: ./register-jsonschema
        with:
          org-name: dpetest
          fix-schema-name: "true"
          schema-dir: ${{ steps.generate.outputs.schemas }}
          synapse-auth-token: ${{ secrets.SYNAPSE_AUTH_TOKEN }}

      - name: Check Registered URIs
        env:
          URIS: ${{ steps.register.outputs.uris }}
        run: ./tests/check_uris.sh 3 dpetest
